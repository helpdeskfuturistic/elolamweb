kind = "web"
previewPath = "/"
title = "FoodLink"
version = "1.0.0"
id = "artifacts/foodlink"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18120

[services.development]
run = "pnpm --filter @workspace/foodlink run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/foodlink", "run", "build" ]
serve = "static"
publicDir = "artifacts/foodlink/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18120"
BASE_PATH = "/"
